name: check

on: [push, pull_request]

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Edge cases
        run: python tests/check.py
      - name: Examples and their tests
        shell: bash
        run: |
          for f in lib/*.swan; do
            python swan.py test "$f" > /dev/null
          done
          for f in examples/*.swan; do
            python swan.py "$f" > /dev/null
            python swan.py test "$f" > /dev/null
          done
